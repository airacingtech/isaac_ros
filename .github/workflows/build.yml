name: build

# Compile-test ALL isaac_ros packages against the host stack this repo targets:
# CUDA 12.8 + TensorRT 10.15 (cuda12). Runs WITHOUT a GPU -- the NVENC/NVDEC codec
# dlopen()s the driver libs at runtime, so only headers are needed to compile.
#
# Guards the environment regressions we hit: CUDA 13 changed cuCtxCreate, and
# TensorRT 11 removed kFP16 / kEXPLICIT_BATCH -- both silently broke the build.
#
# Cost control:
#   * paths filter  -> only runs when build-relevant files change (not docs/params/launch).
#   * dependency caches (apt debs) + build caches (ccache + colcon build/install) are
#     restored, so a source change reinstalls nothing and recompiles ONLY the packages
#     that actually changed. The first run is slow (populates the caches); later runs
#     are incremental.

on:
  pull_request:
    paths: &build_paths
      - "**/*.c"
      - "**/*.cc"
      - "**/*.cpp"
      - "**/*.cu"
      - "**/*.cuh"
      - "**/*.h"
      - "**/*.hpp"
      - "**/*.cmake"
      - "**/CMakeLists.txt"
      - "**/package.xml"
      - "**/*.repos"
      - ".github/workflows/build.yml"
  push:
    branches: [art-jazzy]
    paths: *build_paths
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu24.04
    env:
      DEBIAN_FRONTEND: noninteractive
      TRT_VERSION: "10.15.1.29-1+cuda12.9"           # NOT 11 (drops kFP16/kEXPLICIT_BATCH)
      NV_CODEC_HEADERS_REF: "n13.0.19.0"             # FFmpeg NVENC/NVDEC headers (no login-gated SDK)
      CCACHE_DIR: "${{ github.workspace }}/.ccache"
      CCACHE_MAXSIZE: "3G"
    steps:
      - name: Checkout isaac_ros
        uses: actions/checkout@v4
        with:
          path: src/isaac_ros

      # ---- caches: restored before any install/build so nothing heavy is redone ----
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: apt-${{ runner.os }}-
      - name: Cache ccache + colcon build
        uses: actions/cache@v4
        with:
          path: |
            .ccache
            build
            install
          key: colcon-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            colcon-${{ runner.os }}-

      - name: System packages + ROS 2 Jazzy
        shell: bash
        run: |
          set -euxo pipefail
          # keep downloaded .debs so the apt cache above is populated (don't autoclean)
          rm -f /etc/apt/apt.conf.d/docker-clean
          apt-get update
          apt-get install -y --no-install-recommends \
            git wget curl gnupg2 lsb-release ca-certificates locales \
            build-essential cmake ninja-build ccache software-properties-common
          locale-gen en_US en_US.UTF-8 && update-locale LANG=en_US.UTF-8
          add-apt-repository universe -y
          curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu noble main" \
            > /etc/apt/sources.list.d/ros2.list
          apt-get update
          apt-get install -y \
            ros-jazzy-ros-base ros-dev-tools python3-colcon-common-extensions python3-rosdep

      - name: TensorRT ${{ env.TRT_VERSION }} (base image already ships the CUDA repo)
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --allow-downgrades --allow-change-held-packages \
            libnvinfer-headers-dev=$TRT_VERSION libnvinfer10=$TRT_VERSION libnvinfer-dev=$TRT_VERSION \
            libnvinfer-headers-plugin-dev=$TRT_VERSION libnvinfer-plugin10=$TRT_VERSION \
            libnvinfer-plugin-dev=$TRT_VERSION libnvonnxparsers10=$TRT_VERSION libnvonnxparsers-dev=$TRT_VERSION

      - name: NVENC/NVDEC headers (nv-codec-headers -> /usr/local/include)
        shell: bash
        run: |
          set -euxo pipefail
          if [ ! -f /usr/local/include/nvEncodeAPI.h ]; then
            git clone --depth 1 --branch "$NV_CODEC_HEADERS_REF" \
              https://github.com/FFmpeg/nv-codec-headers.git /tmp/nv-codec-headers
            make -C /tmp/nv-codec-headers install PREFIX=/usr/local
          fi

      - name: rosdep install
        shell: bash
        run: |
          set -euxo pipefail
          rosdep init 2>/dev/null || true
          rosdep update
          source /opt/ros/jazzy/setup.bash
          # CUDA / TensorRT / NVENC are installed above, so skip those rosdep keys.
          rosdep install --from-paths src --ignore-src -y --rosdistro jazzy \
            --skip-keys "cuda cudart tensorrt libnvinfer libnvinfer-dev nvidia-encode nvidia-decode" || true

      - name: colcon build (all packages, incremental via ccache + build cache)
        shell: bash
        run: |
          set -euxo pipefail
          source /opt/ros/jazzy/setup.bash
          export CUDA_HOME=/usr/local/cuda
          export PATH=/usr/local/cuda/bin:$PATH
          ccache -z || true
          # Build everything. *_models_install packages only download NGC assets (not a
          # compile test) -- skip them. Add more to --packages-skip if a package needs
          # deps unavailable in CI.
          colcon build \
            --packages-skip-regex ".*_models_install" \
            --cmake-args -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache \
            --parallel-workers 2 \
            --event-handlers console_direct+
          ccache -s || true
